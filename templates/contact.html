{% extends "base.html" %}

{% block title %}
Contact Us - DataClean Pro
{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                Contact DataClean Pro
            </h1>

            <p class="text-muted">
                Have a question, need help, or want to learn more?
                Send us a message.
            </p>

        </div>


        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4 p-md-5">

                        <form method="post">

                            {% csrf_token %}


                            <div class="mb-3">

                                <label
                                    for="name"
                                    class="form-label fw-semibold"
                                >
                                    Name
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    id="name"
                                    class="form-control"
                                    placeholder="Your name"
                                    required
                                >

                            </div>


                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-semibold"
                                >
                                    Email
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="you@example.com"
                                    required
                                >

                            </div>


                            <div class="mb-3">

                                <label
                                    for="subject"
                                    class="form-label fw-semibold"
                                >
                                    Subject
                                </label>

                                <input
                                    type="text"
                                    name="subject"
                                    id="subject"
                                    class="form-control"
                                    placeholder="How can we help?"
                                    required
                                >

                            </div>


                            <div class="mb-4">

                                <label
                                    for="message"
                                    class="form-label fw-semibold"
                                >
                                    Message
                                </label>

                                <textarea
                                    name="message"
                                    id="message"
                                    rows="6"
                                    class="form-control"
                                    placeholder="Write your message..."
                                    required
                                ></textarea>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >

                                <i class="bi bi-send me-1"></i>

                                Send Message

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
