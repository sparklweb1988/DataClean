{% extends "base.html" %}

{% block title %}
Login - DataClean Pro
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <i class="bi bi-database-check fs-1 text-primary"></i>

                        <h3 class="fw-bold mt-2">
                            Welcome Back
                        </h3>

                        <p class="text-muted">
                            Login to your DataClean Pro account.
                        </p>

                    </div>


                    {% if error %}

                        <div class="alert alert-danger">
                            {{ error }}
                        </div>

                    {% endif %}


                    <form
                        method="post"
                        action="/login/"
                    >

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required
                                autofocus
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>


                    <p class="text-center text-muted mt-4 mb-0">

                        Don't have an account?

                        <a href="/register/">
                            Create one
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
