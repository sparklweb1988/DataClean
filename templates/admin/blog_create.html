{% extends "base.html" %}

{% block title %}
Create Blog Post - DataClean Pro
{% endblock %}


{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">


                    <div class="mb-4">

                        <h2 class="fw-bold">
                            Create Blog Post
                        </h2>

                        <p class="text-muted">
                            Your post will be published immediately.
                        </p>

                    </div>


                    <form
                        method="post"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control form-control-lg"
                                placeholder="Enter blog title"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Featured Image
                            </label>

                            <input
                                type="file"
                                name="featured_image"
                                class="form-control"
                                accept="image/*"
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Excerpt
                            </label>

                            <textarea
                                name="excerpt"
                                class="form-control"
                                rows="3"
                                placeholder="Short description of the article"
                            ></textarea>

                        </div>


                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Content
                            </label>

                            <textarea
                                name="content"
                                class="form-control"
                                rows="15"
                                placeholder="Write your article here..."
                                required
                            ></textarea>

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >

                                <i class="bi bi-send me-1"></i>

                                Publish Post

                            </button>


                            <a
                                href="/admin-dashboard/blog/"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
